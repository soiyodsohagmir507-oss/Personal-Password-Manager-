<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner shield frame -->
  <path d="M256 64 C340 64, 400 96, 400 96 V240 C400 340, 310 416, 256 448 C202 416, 112 340, 112 240 V96 C112 96, 172 64, 256 64 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Lock Body -->
  <rect x="186" y="236" width="140" height="110" rx="20" fill="url(#shieldGrad)" />
  
  <!-- Lock Shackle -->
  <path d="M210 236 V186 C210 160, 230 140, 256 140 C282 140, 302 160, 302 186 V236" 
        fill="none" stroke="url(#lockGrad)" stroke-width="22" stroke-linecap="round" />

  <!-- Keyhole -->
  <circle cx="256" cy="280" r="12" fill="#0f172a" />
  <polygon points="250,285 262,285 260,312 252,312" fill="#0f172a" />
</svg>
